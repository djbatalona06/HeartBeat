name: Deploy Worker

# The Worker had no workflow at all: a push fix or a schema migration meant
# running `wrangler deploy` by hand from one particular laptop. That is a single
# point of failure made of tribal knowledge, and it is the reason this exists.
#
# Separate from deploy.yml rather than a job inside it, because the two deploy
# different things on different triggers: Pages ships on every push to main,
# and the Worker only needs to when worker/ actually changed.
#
# Requires the same two repository secrets as deploy.yml, but the token needs
# one more permission than Pages does:
#   CLOUDFLARE_API_TOKEN   — "Workers Scripts: Edit" (to deploy) and
#                            "D1: Edit" (to apply migrations)
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in quick succession must not race a migration against a deploy.
# Not cancel-in-progress: a half-applied migration is worse than a slow queue.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        # From the repo root: this is an npm workspace, and installing from
        # worker/ alone would not resolve the hoisted dependencies.
        working-directory: .
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # The Worker owns push encryption and the boss fight. Shipping either
        # untested to the only copy that exists is not worth the minute saved.
        run: npm test

      - name: Verify the token can see this account
        # Fail here, with a readable message, rather than four steps later with
        # whatever wrangler says when it cannot authenticate.
        run: |
          set -euo pipefail
          curl -sfS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" \
            > /dev/null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        # Before the deploy, never after: new code meeting an old schema is the
        # failure this ordering exists to prevent. Migrations are additive and
        # idempotent (CREATE TABLE IF NOT EXISTS), so a re-run is a no-op.
        run: npx wrangler d1 migrations apply heartbeat --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
