name: Deploy

# Only from main. Deploying from a feature branch would publish unreviewed code
# to the live app, and the pull request already proves the build in CI.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — needs "Cloudflare Pages: Edit", and now also "D1:
#                            Edit" and "Workers AI: Read", because the Pages
#                            Functions in app/functions bind both
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  PAGES_PROJECT: heartbeat-eop
  # Photographs live here rather than in D1. See app/functions/api/media.ts.
  MEDIA_BUCKET: heartbeat-media

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # Pages serves from the root of its own subdomain. The base must match
        # or the service worker scope will not line up and registration fails
        # silently on iOS.
        run: npm run build
        env:
          APP_BASE: /

      - name: Verify the account, then ensure the Pages project exists
        # `pages deploy` cannot create a project non-interactively, so a first
        # deploy into a fresh account would otherwise fail.
        #
        # This used to grep the output of `wrangler pages project list`, which
        # failed three separate ways and cost days of debugging a deploy that
        # went to the wrong account:
        #
        #   1. No `pipefail`. A wrangler auth error printed to stderr, left
        #      stdout empty, and grep's non-match sent the run on to `project
        #      create` — against whatever account did answer.
        #   2. `project list` renders a *table*, and long names are truncated
        #      with an ellipsis, so an existing project could read as missing.
        #   3. `grep -w` counts `-` as a word boundary, so `heartbeat-eop`
        #      matched a different project named `heartbeat-eop-preview`.
        #
        # The API answers with JSON instead: an exact match on `.name`, and
        # `curl -f` turns an unauthorised token into a failure here rather than
        # a surprise three steps later.
        run: |
          set -euo pipefail
          projects="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          curl -sfS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$projects?per_page=100" > projects.json
          if jq -e --arg n "$PAGES_PROJECT" '.result[] | select(.name == $n)' projects.json > /dev/null; then
            echo "Project $PAGES_PROJECT exists in account $CLOUDFLARE_ACCOUNT_ID."
          else
            echo "Project $PAGES_PROJECT not found in account $CLOUDFLARE_ACCOUNT_ID; creating it."
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          fi
          rm -f projects.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ensure the R2 bucket for photographs exists
        # app/wrangler.toml binds MEDIA, and a deploy naming a bucket that does
        # not exist fails at publish. Written the same way as the Pages check
        # above and for the same reasons: exact match, no pipeline to swallow an
        # error, and a token that cannot see the account fails right here.
        #
        # Needs **R2: Edit** on CLOUDFLARE_API_TOKEN, which is newer than the
        # three permissions the Pages deploy alone required.
        run: |
          set -euo pipefail
          r2="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sfS -H "$auth" "$r2?per_page=100" > buckets.json
          if jq -e --arg n "$MEDIA_BUCKET" '.result.buckets[] | select(.name == $n)' buckets.json > /dev/null; then
            echo "Bucket $MEDIA_BUCKET already exists."
          else
            echo "Creating bucket $MEDIA_BUCKET."
            curl -sfS -X POST -H "$auth" -H 'content-type: application/json' \
              --data "{\"name\":\"$MEDIA_BUCKET\"}" "$r2" > /dev/null
          fi
          rm -f buckets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        # Run from app/ so wrangler reads app/wrangler.toml, which carries the
        # D1 and Workers AI bindings and points at dist/. Deploying from the
        # repo root would publish the static build with its functions unbound,
        # and every /api call would 500 at runtime rather than fail here.
        working-directory: app
        run: npx wrangler pages deploy --project-name="$PAGES_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
