name: Deploy

# Only from main. Deploying from a feature branch would publish unreviewed code
# to the live app, and the pull request already proves the build in CI.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   — a token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  PAGES_PROJECT: heartbeat

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # Pages serves from the root of its own subdomain. The base must match
        # or the service worker scope will not line up and registration fails
        # silently on iOS.
        run: npm run build
        env:
          APP_BASE: /

      - name: Create the Pages project if it does not exist
        # `pages deploy` cannot create a project non-interactively, so a first
        # deploy into a fresh account would otherwise fail. Checked explicitly
        # rather than with `|| true`, which would swallow real errors too.
        run: |
          if npx wrangler pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Project $PAGES_PROJECT already exists."
          else
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx wrangler pages deploy app/dist --project-name="$PAGES_PROJECT" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
