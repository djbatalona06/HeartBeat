name: CI

# Deliberately credential-free: this runs on every pull request, including from
# forks, and never needs a deploy secret to prove the build is sound.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Eve's Garden's rules are C# compiled to WebAssembly (`game/`). The
      # wasm-tools workload carries the emscripten toolchain that emits it;
      # without it the Vite build finds no .NET output and fails.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check D1 config sync
        run: npm run check:config

      # The review rules that are greppable: no new raw <button>, no pure
      # black or white, no hand-written z-index above the chrome band. Needs
      # nothing built, so it runs before the slow steps and fails fast.
      - name: Check the UI review rules
        run: npm run ui:check

      # Two audits, because they answer two different questions.
      #
      # The first is a gate: `--omit=dev` is what actually reaches a phone, and
      # a vulnerability there is shipped. It must stay at zero.
      #
      # The second is a report that never fails the build. Dev-toolchain
      # advisories are real but they are not shipped — the vitest/vite/esbuild
      # set that prompted this step was three moderates, a high and a critical,
      # none of which leave a developer's machine. Gating on them means either
      # taking a semver-major upgrade the moment it appears or muting the
      # check, and muting is what actually happens. Dependabot opens the PR
      # instead; see .github/dependabot.yml.
      - name: Audit what ships
        run: npm audit --omit=dev --audit-level=low

      - name: Audit the toolchain (report only)
        if: always()
        continue-on-error: true
        run: npm audit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          APP_BASE: /

      # Chromium for the visual walk and for Lighthouse. The sandbox has one at
      # /opt/pw-browsers; a GitHub runner does not, so it is fetched here. Only
      # chromium — the walk never opens the other two.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Screenshots every screen in two packs and two modes, and runs axe-core
      # on the same visit. Until baselines are committed this seeds them and
      # passes; see docs/design-system.md.
      - name: Visual regression and axe
        run: npm run visual

      - name: Upload visual frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-frames
          path: .shots/visual
          if-no-files-found: ignore
          retention-days: 14

      # Lighthouse against `vite preview`, never the dev server — devOptions is
      # disabled, so there is no service worker in dev and the run would score
      # an app that is not the app. Also asserts the precache budget off the
      # built sw.js rather than off a comment.
      - name: Lighthouse and the precache budget
        run: npm run lighthouse

      - name: Build the gift
        # The gift is a committed artefact, so CI rebuilds it and fails if the
        # checked-in file has drifted from its sources.
        run: |
          node gift/build.mjs
          git diff --exit-code -- gift/birthday.html \
            || (echo "::error::gift/birthday.html is stale — run 'npm run gift:build' and commit the result" && exit 1)

      - name: Build the study page
        # Committed like the gift, and checked the same way: the single-file
        # build is only trustworthy if CI proves it still matches its sources.
        run: |
          node scripts/build-study.mjs
          git diff --exit-code -- study/index.html \
            || (echo "::error::study/index.html is stale — run 'npm run study:build' and commit the result" && exit 1)
