name = "heartbeat-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"

[observability.traces]
enabled = true

# Every minute: the finest granularity Cron Triggers offer, and what keeps a
# 07:00 reminder landing at 07:00 rather than up to an hour late.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "heartbeat"
# Created with: wrangler d1 create heartbeat
database_id = "dcfde6ff-f415-427a-bfc4-c08bd6911699"

[vars]
# Origins allowed to call this Worker: the Pages production URL plus its preview
# subdomains, so pairing and push can be tested from a preview deploy.
ALLOWED_ORIGIN = "https://heartbeat.pages.dev,https://*.heartbeat.pages.dev"
VAPID_SUBJECT = "mailto:batalona06@gmail.com"

# Secrets are set with `wrangler secret put`, never committed:
#   VAPID_PUBLIC_KEY   — base64url P-256 public key
#   VAPID_PRIVATE_KEY  — base64url P-256 private scalar
