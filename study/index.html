why:"Insertion sort beats quicksort below roughly a dozen elements, which is why real sort implementations switch to it at the bottom. An array scan often beats a hash lookup for small collections because it is contiguous in memory.",difficulty:"medium"},{id:"bigo-array-vs-list",question:"Array or linked list for a queue of a million items?",answer:"Almost always the array-backed structure — a ring buffer.",why:'Linked lists have textbook O(1) insertion but every node is a pointer chase into unpredictable memory, and a cache miss costs a hundred-odd cycles. Contiguous memory is why the "worse" complexity usually wins in practice.',difficulty:"medium"},{id:"bigo-hash-average",question:"What is hash table lookup, average and worst case?",answer:"O(1) average, O(n) worst when everything collides.",why:"The worst case is not theoretical: attacker-chosen keys that all hash to one bucket are a real denial-of-service vector, which is why runtimes seed their hash functions randomly. Modern implementations also fall back to a tree per bucket.",difficulty:"medium"},{id:"bigo-amortised",question:"What does amortised O(1) mean for appending to a dynamic array?",answer:"Most appends are O(1); occasionally one is O(n) to resize, and the average over many is constant.",why:"Doubling the capacity means the expensive copies get rarer exactly as fast as they get more expensive. Note it says nothing about the worst single operation — which matters in real-time or latency-sensitive code.",difficulty:"medium"},{id:"bigo-binary-search",question:"What must be true before binary search is valid, and what does it cost?",answer:"The data must already be sorted. O(log n).",why:"The trap is sorting in order to binary search once — that is O(n log n) to save on an O(n) scan. Sorting pays off only when you will search many times, or need the order anyway.",difficulty:"easy"},{id:"bigo-sort-lower-bound",question:"Why can no comparison sort beat O(n log n)?",answer:"There are n! orderings and each comparison yields one bit, so log₂(n!) ≈ n log n comparisons are needed.",why:"It is an information-theoretic bound, not a failure of imagination. Counting and radix sorts beat it precisely because they do not compare — they use the structure of the keys, and pay for it with assumptions about the key space.",difficulty:"hard"},{id:"bigo-stable-sort",question:"What does a stable sort guarantee, and when do you need it?",answer:"Equal elements keep their relative order. You need it when sorting by one key after another.",why:"Sort by name, then stably by department, and within each department names remain ordered. With an unstable sort the first pass is destroyed. JavaScript's `sort` has been required to be stable since ES2019.",difficulty:"medium"},{id:"bigo-quicksort-worst",question:"What is quicksort's worst case and how is it avoided?",answer:"O(n²) on an adversarial or already-sorted input with a naive pivot. Avoided with a randomised or median-of-three pivot.",why:"Choosing the first element as pivot makes sorted input the worst case, which is exactly the input that turns up most often. Introsort switches to heapsort once recursion goes too deep, capping the worst case at O(n log n).",difficulty:"hard"},{id:"bigo-heap",question:"What is a heap good for, and what does it cost?",answer:"Repeatedly taking the smallest or largest item. O(1) peek, O(log n) insert and extract.",why:"It is the right structure for a priority queue, a scheduler, and the top-k problem — where keeping a heap of size k gives O(n log k) instead of sorting everything at O(n log n).",difficulty:"medium"},{id:"bigo-bst-balance",question:"Why does an unbalanced binary search tree degrade to a linked list?",answer:"Inserting sorted data makes every node a right child, so depth becomes n and lookups O(n).",why:"Self-balancing variants — red-black, AVL, B-trees — exist entirely to prevent this. It is why database indexes are B-trees: they guarantee depth, and their wide nodes match the size of a disk page.",difficulty:"medium"},{id:"bigo-btree-index",question:"Why are database indexes B-trees rather than binary trees?",answer:"Each node holds hundreds of keys and fills one page, so a lookup costs three or four disk reads instead of thirty.",why:"When the unit of cost is a page fetch rather than a comparison, minimising tree height is everything. A binary tree of a million rows is twenty levels deep; a B-tree is three.",difficulty:"hard"},{id:"bigo-trie",question:"What problem is a trie the right answer to?",answer:"Prefix queries — autocomplete, routing tables, dictionary membership.",why:"Lookup is O(length of the key), independent of how many keys are stored. The cost is memory, which is why real implementations compress runs of single-child nodes into a radix tree.",difficulty:"medium"},{id:"bigo-two-pointer",question:"What does the two-pointer technique buy you on a sorted array?",answer:"It turns many O(n²) nested-loop problems into O(n).",why:'For "find a pair summing to a target", move the left pointer up when the sum is too small and the right down when too big. Each pointer moves at most n times. The related sliding window does the same for subarray problems.',difficulty:"medium"},{id:"bigo-memoisation",question:"How does memoisation change naive recursive Fibonacci?",answer:"From O(2ⁿ) to O(n), by never recomputing a subproblem.",why:"That is the whole of dynamic programming: overlapping subproblems plus a cache. Top-down memoisation and bottom-up tabulation are the same idea; the bottom-up version avoids the call stack and is usually faster.",difficulty:"medium"},{id:"bigo-space-time",question:'What is the space complexity of the common "count occurrences with a hash map" approach?',answer:"O(k) for k distinct values — often the trade that buys the time improvement.",why:"Worth stating explicitly in an interview and in review: converting an O(n²) scan to O(n) usually costs O(n) memory. On a stream too large to hold, that trade is not available and you need a sketch instead.",difficulty:"medium"},{id:"bigo-set-membership",question:"Why is `array.includes` inside a loop a classic performance bug?",answer:"It is O(n) per call, so the loop is O(n²). A Set makes it O(1) per call.",why:"It is the single most common accidental quadratic in application code, and it is invisible in testing because it only bites at scale. Building the Set costs one pass.",difficulty:"easy"},{id:"bigo-string-concat",question:"Why is building a string by repeated concatenation in a loop dangerous?",answer:"In languages with immutable strings each concatenation copies the whole thing, making it O(n²).",why:"Collect the pieces in an array and join once. Some runtimes optimise this with ropes or in-place growth, but relying on that is relying on an implementation detail.",difficulty:"medium"},{id:"bigo-bfs-dfs",question:"When do you choose BFS over DFS?",answer:"When you need the shortest path in an unweighted graph, or the answer is likely near the start.",why:"BFS visits in order of distance, so the first time it reaches the target is by a shortest route. DFS uses less memory on wide graphs and is natural for exhaustive search, topological ordering and cycle detection.",difficulty:"medium"},{id:"bigo-dijkstra",question:"What does Dijkstra require that BFS does not, and what breaks it?",answer:"Weighted edges and a priority queue. Negative edge weights break it.",why:"It commits to a node's distance when it pops it, which a later negative edge could invalidate. Bellman-Ford handles negatives at O(V·E); A* adds a heuristic to Dijkstra to explore fewer nodes.",difficulty:"hard"},{id:"bigo-lru",question:"What two structures does an LRU cache need, and why?",answer:"A hash map for O(1) lookup and a doubly linked list for O(1) reordering and eviction.",why:'Neither alone works: the map cannot track recency, and the list cannot find an entry quickly. The map stores node references into the list. It is the classic "combine two structures" interview question and a genuinely common piece of code.',difficulty:"hard"},{id:"bigo-bloom",question:"What does a Bloom filter tell you, and what is the catch?",answer:"Definitely-not-present or maybe-present, in tiny constant space. False positives, never false negatives.",why:"Perfect as a cheap gate before an expensive lookup — a disk read, a network call. Standard Bloom filters also cannot delete, which is what counting variants address.",difficulty:"hard"},{id:"bigo-tail-call",question:"Why can deep recursion crash where an equivalent loop does not?",answer:"Each call consumes a stack frame, and the stack is small and fixed.",why:"Tail-call optimisation would fix it but most runtimes — including every major JavaScript engine except JavaScriptCore — do not implement it. Recursion depth proportional to input size is a latent crash.",difficulty:"medium"},{id:"bigo-n-plus-one",question:"What is an N+1 query problem?",answer:"One query fetches N rows, then a query per row fetches its related data — N+1 round trips.",why:"The most common performance bug in any ORM-backed application, because the code that causes it looks like an innocent loop over a relation. The fixes are eager loading with a join, or one batched IN query.",difficulty:"medium"},{id:"bigo-profile-first",question:"What is the first thing to do about a slow program?",answer:"Measure it. Intuition about where the time goes is reliably wrong.",why:"Optimising the wrong 90% costs time and adds complexity for nothing. A profiler routinely shows the cost sitting somewhere nobody suspected — serialisation, logging, an accidental quadratic in a helper.",difficulty:"easy"}]),jh=qt("git","Git","The object model, and how to get out of trouble.",[{id:"git-commit-is",question:"What is a commit, physically?",answer:"A snapshot of the whole tree, plus a pointer to its parent, author, message, and a hash of all of it.",why:"Git does not store diffs. Diffs are computed on demand between two snapshots. Because the hash covers the parent, changing any commit changes every commit after it — which is why rewriting history gives you new hashes.",difficulty:"medium"},{id:"git-branch-is",question:"What is a branch?",answer:"A movable file containing one commit hash. Nothing more.",why:"This is why branching is instant and free — it writes 41 bytes. It also explains why deleting a branch does not delete commits: it removes a label, and the commits stay until garbage collection cannot reach them from any label.",difficulty:"easy"},{id:"git-head",question:"What is HEAD?",answer:"A pointer to the branch you are on — or, when detached, directly to a commit.",why:"Detached HEAD means commits you make have no branch pointing at them, so moving away loses them from normal view. They are still findable in the reflog until garbage collection, which is what makes the state recoverable rather than fatal.",difficulty:"easy"},{id:"git-three-trees",question:"What are the three places a file can be?",answer:"The working directory, the index (staging area), and the last commit (HEAD).",why:"Nearly every git command is a way of moving changes between those three. `add` copies working to index; `commit` copies index to HEAD; `checkout` copies the other way. Knowing which two a command touches predicts what it will destroy.",difficulty:"easy"},{id:"git-reset-modes",question:"What is the difference between `reset --soft`, `--mixed` and `--hard`?",answer:"Soft moves the branch only; mixed also resets the index; hard also overwrites the working directory.",why:"Mixed is the default. Hard is the only one that can lose uncommitted work, and it is the one command in ordinary use that genuinely destroys data — everything else can be recovered from the reflog.",difficulty:"medium"},{id:"git-revert-vs-reset",question:"When do you revert rather than reset?",answer:"When the commit is already pushed and other people have it.",why:"Revert makes a new commit that undoes the change, so history is append-only and nobody else has to do anything. Reset rewrites history, which forces everyone downstream to reconcile — fine on your own unpushed branch, rude on a shared one.",difficulty:"easy"},{id:"git-merge-vs-rebase",question:"What is the practical difference between merge and rebase?",answer:"Merge records that two lines came together; rebase replays your commits onto a new base, giving new hashes and a straight line.",why:"Merge preserves what actually happened, at the cost of a knotted graph. Rebase produces a history that reads as a story, at the cost of it being a story. The usual rule: rebase your own unpushed work, merge anything shared.",difficulty:"medium"},{id:"git-golden-rule",question:"What is the golden rule of rebasing?",answer:"Never rebase commits that exist in someone else's repository.",why:"Rebasing replaces commits with new ones. Anyone who had the originals now has both, and merging the two sets duplicates every commit. On a shared branch the fix is a merge; on your own feature branch, rebase freely.",difficulty:"medium"},{id:"git-fast-forward",question:"What is a fast-forward merge?",answer:"When the target branch is a direct ancestor, git just moves the label forward — no merge commit.",why:"`--no-ff` forces a merge commit anyway, which keeps the shape of a feature branch visible in the graph. Teams argue about this; the honest summary is that it trades a noisier graph for the ability to see and revert a feature as a unit.",difficulty:"medium"},{id:"git-reflog",question:"What is the reflog, and when does it save you?",answer:"A local log of every position HEAD has held. It recovers commits no branch points at any more.",why:"After a bad reset, a botched rebase, or a deleted branch, `git reflog` shows the hash you were on and `git reset --hard <hash>` puts you back. It is local-only and expires by default after 90 days, so it is a safety net, not a backup.",difficulty:"medium"},{id:"git-stash",question:"What does `git stash` do, and what does it miss by default?",answer:"Saves tracked modifications and clears the working tree. It ignores untracked and ignored files unless you pass `-u` or `-a`.",why:'The default is the cause of the classic "my new file was not stashed and then got clobbered". `git stash -u` includes untracked files. Stashes are also easy to forget about — they are a queue, not a branch.',difficulty:"easy"},{id:"git-cherry-pick",question:"What does `git cherry-pick` do?",answer:"Applies the change from one commit as a new commit on your current branch.",why:"Useful for pulling one hotfix out of a branch that is not ready. The new commit has a different hash, so cherry-picking and later merging the source branch can present the same change twice — usually harmless, occasionally a conflict.",difficulty:"medium"},{id:"git-fetch-vs-pull",question:"What is the difference between `fetch` and `pull`?",answer:"Fetch downloads and updates the remote-tracking branches. Pull is fetch followed by a merge or rebase into your branch.",why:"Fetch is always safe — it never touches your working tree, so it cannot conflict. Pull can. Fetching first and looking at what arrived, then integrating deliberately, is the habit that avoids most surprise merges.",difficulty:"easy"},{id:"git-force-with-lease",question:"Why prefer `--force-with-lease` over `--force`?",answer:"It refuses the push if the remote moved since you last fetched, so you cannot silently erase someone else's work.",why:"Plain `--force` overwrites the remote branch regardless of what is there. With-lease checks that the remote is where you think it is first. On a branch you share with anyone, it is the only acceptable force.",difficulty:"medium"},{id:"git-detached-recover",question:"You committed on a detached HEAD and checked out main. How do you keep the work?",answer:"Find the hash in `git reflog` and `git branch <name> <hash>`.",why:"The commits were never lost — they simply had nothing pointing at them. Creating a branch at that hash makes them reachable again. This works until garbage collection prunes unreachable objects, which is not immediate.",difficulty:"medium"},{id:"git-interactive-rebase",question:"What can an interactive rebase do?",answer:"Reorder, edit, squash, fixup, drop or reword any commit in a range.",why:'It is how a messy branch of fourteen "wip" commits becomes three that explain themselves before review. All of it rewrites hashes, so the golden rule applies — do it before you share, not after.',difficulty:"medium"},{id:"git-bisect",question:"What does `git bisect` do?",answer:"Binary-searches the history for the commit that introduced a bug, given a known-good and known-bad commit.",why:'It turns "somewhere in the last 500 commits" into about nine checkouts. With `git bisect run <script>` that exits non-zero on failure, it finds the culprit unattended — the highest-leverage git command almost nobody uses.',difficulty:"hard"},{id:"git-blame-w",question:"Why is `git blame` often useless on a reformatted file, and what fixes it?",answer:"A formatting commit rewrites every line. `-w` ignores whitespace, and `--ignore-rev` skips a named commit.",why:"A repo can also list bulk-reformat commits in `.git-blame-ignore-revs` so every blame skips them by default. Without that, the entire file is attributed to whoever ran the formatter.",difficulty:"hard"},{id:"git-merge-conflict",question:"What does a merge conflict actually mean?",answer:"Both sides changed the same region since the common ancestor, so git will not guess.",why:"Git merges by three-way comparison against the merge base, not by comparing the two tips. That is why a change on one side alone applies cleanly however large it is, and why two one-character edits on the same line conflict.",difficulty:"medium"},{id:"git-gitignore-tracked",question:"Why does adding a file to `.gitignore` not stop it being committed?",answer:"Ignore rules only apply to untracked files. An already-tracked file keeps being tracked.",why:'You need `git rm --cached <file>` to stop tracking it, then commit that removal. This is the usual reason a `.env` keeps appearing in diffs after someone "fixed it in gitignore" — and if it was ever pushed, the secret is in history and must be rotated.',difficulty:"medium"},{id:"git-tag-vs-branch",question:"How does a tag differ from a branch?",answer:"A tag is a label that does not move; a branch advances with each commit.",why:"Tags mark releases. An annotated tag is a real object with a message, tagger and optional signature; a lightweight tag is just a pointer. Tags are also not pushed by default — `git push --tags` or push the ref explicitly.",difficulty:"easy"},{id:"git-squash-merge",question:"What does a squash merge do to future merges from that branch?",answer:"It creates one new commit unrelated to the branch's commits, so the branch appears unmerged and re-merging replays everything.",why:"The tidy single commit on main shares no ancestry with the feature commits. The convention that goes with squash merging is to delete the branch immediately and never merge from it again.",difficulty:"hard"},{id:"git-amend",question:"What does `git commit --amend` actually do?",answer:"Replaces the last commit with a new one — new hash, new content, same parent.",why:"Nothing is edited in place; the old commit is orphaned and sits in the reflog. That is why amending a pushed commit needs a force push, and why amending is safe on work you have not shared.",difficulty:"easy"},{id:"git-worktree",question:"What problem does `git worktree` solve?",answer:"Checking out a second branch into a separate directory sharing one repository, with no stashing and no second clone.",why:"Perfect for reviewing a PR or running a long build while you keep working. It shares the object store, so it costs a working copy rather than a full clone, and each worktree has its own index and HEAD.",difficulty:"hard"},{id:"git-shallow-clone",question:"What does `git clone --depth 1` trade away?",answer:"History. You get the tip only, so log, blame, bisect and merge-base are unavailable or wrong.",why:"Right for CI, where the checkout is disposable and the clone time matters. Wrong for a working copy, and a common cause of CI jobs that cannot diff against a base branch until the fetch depth is increased.",difficulty:"medium"}]),Mh=qt("http","HTTP & the web","Status codes, caching, CORS, cookies, auth.",[{id:"http-idempotent",question:"What does it mean for a method to be idempotent, and which ones are?",answer:"Repeating it has the same effect as doing it once. GET, HEAD, PUT and DELETE are; POST and PATCH are not.",why:"It is what makes a retry safe. A network timeout leaves you not knowing whether the request landed — with an idempotent method you just send it again. With POST you need an idempotency key, which is why payment APIs all have one.",difficulty:"medium"},{id:"http-put-patch",question:"What is the difference between PUT and PATCH?",answer:"PUT replaces the whole resource; PATCH applies a partial change.",why:'The practical consequence is that a PUT missing a field should clear that field, not leave it alone. Most APIs that call it PUT actually implement PATCH semantics, which is a reliable source of "why did my other field disappear".',difficulty:"easy"},{id:"http-401-403",question:"What is the difference between 401 and 403?",answer:"401 means not authenticated — who are you? 403 means authenticated but not permitted.",why:"A 401 invites the client to supply credentials and should carry a `WWW-Authenticate` header. A 403 says credentials will not help. Sending 401 for a permission failure sends clients into a pointless re-login loop.",difficulty:"easy"},{id:"http-404-vs-403",question:"When is returning 404 for a forbidden resource the right call?",answer:"When the existence of the resource is itself confidential.",why:"A 403 confirms the thing exists, which leaks information — an attacker can enumerate valid ids by the difference between 403 and 404. Deliberately returning 404 removes the oracle at the cost of a slightly confusing error.",difficulty:"hard"},{id:"http-422",question:"What does 422 mean, and how is it different from 400?",answer:"400 is malformed — the server could not parse it. 422 parsed fine but failed validation.",why:"Useful to distinguish because they need different client behaviour: a 400 is a bug in your request construction, a 422 is something to show the user next to a form field.",difficulty:"medium"},{id:"http-429",question:"What should a client do on a 429?",answer:"Back off, honouring `Retry-After` if present, ideally with exponential backoff plus jitter.",why:"Jitter matters as much as backoff: without it every rate-limited client retries at the same instant and the thundering herd re-limits everyone. Retrying immediately on 429 is the fastest way to get banned outright.",difficulty:"medium"},{id:"http-301-302",question:"Why is a 301 dangerous to issue casually?",answer:"It is permanent, and browsers cache it aggressively — sometimes indefinitely.",why:"A mistaken 301 can persist in users' browsers long after the server is fixed, and there is no way to reach out and clear it. Use 302 or 307 while you are unsure; 308 and 307 additionally preserve the method and body, which 301 and 302 historically did not.",difficulty:"medium"},{id:"http-cache-control",question:"What does `Cache-Control: no-cache` actually mean?",answer:"Store it, but revalidate with the server before reusing it. `no-store` is the one that means do not keep it.",why:'This naming trips up nearly everyone. `no-cache` still writes to disk, so it is not sufficient for sensitive data — that needs `no-store`. And `private` means "browser may cache, shared proxies may not".',difficulty:"medium"},{id:"http-etag",question:"How does an ETag save bandwidth?",answer:"The client sends it back in `If-None-Match`; an unchanged resource gets a 304 with no body.",why:"Conditional requests still cost a round trip but not the payload. `Last-Modified`/`If-Modified-Since` does the same with a timestamp, which is coarser — one-second resolution and clock-dependent.",difficulty:"medium"},{id:"http-immutable-assets",question:"Why are hashed asset filenames paired with a one-year cache?",answer:"The content cannot change without the filename changing, so the cache never needs invalidating.",why:"Cache invalidation is avoided rather than solved. The HTML that references them stays uncached or short-cached, so a deploy changes one small document and every large asset is either already held or fetched once, forever.",difficulty:"medium"},{id:"http-cors-what",question:"What is CORS actually protecting?",answer:"It stops a script on one origin reading a response from another, unless that origin opts in.",why:"It does not stop the request being sent — the server may already have acted on it. CORS is a read restriction enforced by the browser, which is why it protects users from malicious pages and never protects a server from anything.",difficulty:"medium"},{id:"http-preflight",question:"What triggers a CORS preflight?",answer:"Anything beyond a simple request: a method other than GET/HEAD/POST, a custom header, or a non-form content type such as application/json.",why:"This is why sending JSON with an Authorization header always costs an extra OPTIONS round trip. `Access-Control-Max-Age` lets the browser cache the preflight result and skip it for subsequent calls.",difficulty:"hard"},{id:"http-cors-credentials",question:"Why does `Access-Control-Allow-Origin: *` fail once credentials are involved?",answer:"With credentials the spec forbids the wildcard — the server must echo the specific origin and send `Allow-Credentials: true`.",why:"Otherwise any site could make authenticated requests with the user's cookies and read the answer. Echoing the origin means you must validate it against an allowlist, not reflect whatever arrived.",difficulty:"hard"},{id:"http-samesite",question:"What does `SameSite=Lax` on a cookie do?",answer:"Sends the cookie on top-level navigations to your site but not on cross-site subrequests.",why:"It is CSRF protection built into the cookie, and now the browser default. `Strict` also withholds it on inbound links, which logs users out when they arrive from elsewhere. `None` sends it always and requires `Secure`.",difficulty:"medium"},{id:"http-httponly",question:"What does `HttpOnly` protect against, and what does it not?",answer:"It hides the cookie from JavaScript, so XSS cannot exfiltrate it. It does nothing against CSRF.",why:"The two defences solve different attacks: HttpOnly stops the token being stolen, SameSite and CSRF tokens stop it being used from another site. A session cookie wants both, plus `Secure`.",difficulty:"medium"},{id:"http-jwt-storage",question:"Why is storing a JWT in localStorage contentious?",answer:"Any XSS on the page can read it, and unlike a cookie it cannot be marked HttpOnly.",why:'The usual counter is that cookies bring CSRF — but SameSite largely answers that, whereas nothing answers "script on my page can read my token". An HttpOnly, Secure, SameSite cookie is the more defensible default.',difficulty:"hard"},{id:"http-jwt-revoke",question:"What is the fundamental limitation of a JWT for sessions?",answer:"It is self-validating, so you cannot revoke one before it expires without keeping server state.",why:"That trades away the very thing that made it appealing. The usual compromise: short-lived access tokens plus a revocable refresh token, so a logout takes effect within minutes rather than instantly or never.",difficulty:"hard"},{id:"http-https-protects",question:"What does HTTPS protect, and what does it still leak?",answer:"It encrypts the URL path, headers and body. It leaks the destination IP, and the hostname via SNI and DNS.",why:'So an observer knows you visited a site but not which page. This is also why "the query string is encrypted" is true on the wire yet irrelevant — the URL still lands in server logs, browser history, and Referer headers.',difficulty:"medium"},{id:"http-content-type",question:"Why does a missing or wrong `Content-Type` cause such odd bugs?",answer:"Servers pick a parser from it, and browsers may sniff the type of a response and treat it as something else.",why:"A JSON body sent as text/plain may reach the handler unparsed. On responses, MIME sniffing can turn an uploaded file into executable HTML — which is what `X-Content-Type-Options: nosniff` exists to prevent.",difficulty:"medium"},{id:"http-keepalive",question:"What did HTTP/1.1 keep-alive and then HTTP/2 multiplexing each solve?",answer:"Keep-alive reuses one TCP connection for several requests; HTTP/2 sends many requests concurrently over one connection.",why:"Keep-alive removed the handshake per request but kept head-of-line blocking within the connection. HTTP/2 interleaves streams, which is why domain sharding and sprite sheets became counterproductive rather than clever.",difficulty:"hard"},{id:"http-post-redirect-get",question:"What problem does the Post/Redirect/Get pattern solve?",answer:"Refreshing after a form POST re-submits it. Redirecting to a GET makes refresh harmless.",why:"It is why a successful form usually answers 303 and a new URL rather than rendering the result directly. It also makes the result page bookmarkable and gives the back button sane behaviour.",difficulty:"easy"},{id:"http-rest-statelessness",question:"What does it mean that REST is stateless?",answer:"Every request carries everything needed to serve it; the server keeps no per-client conversation state.",why:"It is what lets any instance behind a load balancer answer any request, which is the whole basis of horizontal scaling. Server-side sessions are the common compromise, and the reason they get pushed into Redis rather than memory.",difficulty:"medium"},{id:"http-pagination",question:"Why does cursor pagination beat `OFFSET` for large or live datasets?",answer:"Offset re-scans everything skipped and shifts when rows are inserted, so pages overlap or skip items.",why:"A cursor keyed on an indexed, ordered column seeks straight to the position and is stable under inserts. Offset stays fine for small, static result sets and for jumping to an arbitrary page number.",difficulty:"hard"},{id:"http-websocket-sse",question:"When is Server-Sent Events the better choice over a WebSocket?",answer:"When the data only flows server to client. SSE is plain HTTP and reconnects automatically.",why:"It rides existing infrastructure, works through most proxies, and the browser handles retry and last-event-id resumption for you. WebSockets earn their extra complexity when the client also needs to push, frequently and with low latency.",difficulty:"medium"},{id:"http-timeouts",question:"Why does a service without client timeouts fail worse than one with them?",answer:"Requests pile up waiting on a slow dependency until connections and threads are exhausted, turning one slow service into a total outage.",why:'This is cascading failure, and a timeout is the cheapest defence — it converts "hangs forever" into "fails fast", which a retry or circuit breaker can then handle. The default in most HTTP clients is no timeout at all.',difficulty:"hard"}]),zh=qt("js","JavaScript","Coercion, scope, this, and the event loop.",[{id:"js-typeof-null",question:"What does `typeof null` return, and why?",answer:'"object" — a bug from 1995 that can never be fixed.',why:"Values were tagged by their low bits; the object tag was 000, and null was the null pointer, all zeroes. It reads as an object tag. Fixing it would break the web, so it stays. Use `value === null` to test for null.",difficulty:"easy"},{id:"js-equality",question:"When should you use `==` instead of `===`?",answer:"Effectively never, with one idiom: `x == null` matches both null and undefined.",why:'`==` applies coercion rules almost nobody has memorised, which is why `0 == ""` and `null == undefined` are both true while `null == 0` is false. The one place it earns its keep is the null check, because it catches undefined in the same breath.',difficulty:"easy"},{id:"js-nan",question:"How do you test whether a value is NaN?",answer:"`Number.isNaN(x)`. Never `x === NaN`, and preferably not the global `isNaN`.",why:'NaN is the only value not equal to itself, so `===` can never find it. The global `isNaN` coerces first, so `isNaN("hello")` is true — it answers "is this not a number", not "is this NaN". `Number.isNaN` does no coercion.',difficulty:"easy"},{id:"js-hoisting",question:"What is the temporal dead zone?",answer:"The span between a `let`/`const` binding being created and being initialised, where touching it throws a ReferenceError.",why:"`let` and `const` are hoisted like `var` — the binding exists from the top of the block — but unlike `var` they are not initialised to undefined. That gap is the dead zone. It turns a silent undefined into a loud error, which is the point.",difficulty:"medium"},{id:"js-closure",question:"What is a closure?",answer:"A function together with the scope it was defined in, kept alive as long as the function is.",why:"Every function in JavaScript is a closure. It matters when the function outlives the call that made it — a callback, a returned function, an event handler — because the variables it captured are captured by reference, not copied.",difficulty:"medium"},{id:"js-loop-var",question:"Why does a `var` loop counter print the final value in every `setTimeout`, while `let` prints each one?",answer:"`var` creates one binding for the whole function; `let` creates a fresh binding per iteration.",why:"The classic interview question, and it is really about closures capturing by reference. With `var` all three callbacks close over the same variable, which is 3 by the time they run. `let` in a for-loop is specified to rebind each pass, so each callback closes over its own.",difficulty:"medium"},{id:"js-this",question:"What determines the value of `this` in a normal function?",answer:"How it is called, not where it is defined.",why:"Called as `obj.fn()`, `this` is obj. Called bare, it is undefined in strict mode and globalThis otherwise. Called with `call`/`apply`/`bind`, it is whatever you passed. This is why extracting a method into a variable breaks it.",difficulty:"medium"},{id:"js-arrow-this",question:"How is `this` different inside an arrow function?",answer:"Arrows have no `this` of their own — they use the enclosing scope, decided where they are written.",why:"That is why arrows are right for callbacks inside a method and wrong for object methods and prototypes: an arrow used as a method closes over the surrounding scope rather than the object it was called on.",difficulty:"medium"},{id:"js-event-loop",question:"In what order do a `Promise.resolve().then()` and a `setTimeout(..., 0)` scheduled together run?",answer:"The promise callback first. Microtasks drain completely before the next macrotask.",why:"The event loop runs one macrotask (a timer, an I/O callback), then empties the entire microtask queue before the next. So promises always beat timers scheduled in the same tick — and an endless chain of microtasks can starve timers entirely.",difficulty:"hard"},{id:"js-await-loop",question:"What is wrong with `await`-ing inside a `for` loop over independent requests?",answer:"It serialises them. Ten 200ms requests take two seconds instead of 200ms.",why:"Each `await` waits for that one before starting the next. When the work is independent, start it all and then wait: `await Promise.all(items.map(fetchOne))`. Keep the sequential loop only when each step genuinely needs the last one, or when you are deliberately rate-limiting.",difficulty:"medium"},{id:"js-promise-all-settled",question:"When do you want `Promise.allSettled` over `Promise.all`?",answer:"When one failure should not discard the successes.",why:"`Promise.all` rejects the moment any input rejects, and the results of the ones that succeeded are lost. `allSettled` always fulfils, with a status/value or status/reason per entry — right for a batch where partial success is still useful.",difficulty:"medium"},{id:"js-spread-shallow",question:"What does `{ ...obj }` copy?",answer:"One level. Nested objects and arrays are shared with the original, not cloned.",why:"A shallow copy is usually what you want and occasionally a disaster — mutating `copy.address.city` also changes the original. For a real deep copy use `structuredClone(obj)`, which also handles Dates, Maps and cycles that JSON round-tripping destroys.",difficulty:"easy"},{id:"js-optional-chain",question:"What does `a?.b.c` do if `a` is null?",answer:"Returns undefined without evaluating the rest — the whole chain short-circuits.",why:"A common misreading is that only the `?.` link is guarded and `.c` then throws. It does not: `?.` short-circuits everything to its right. Note this guards null and undefined only, not the empty string or 0.",difficulty:"medium"},{id:"js-nullish",question:"How does `??` differ from `||` for defaults?",answer:"`??` only falls through on null and undefined; `||` falls through on every falsy value.",why:'This is a real bug source: `count || 10` turns a legitimate 0 into 10, and `name || "anon"` turns an empty string into "anon". `??` gives the default only when the value is genuinely absent.',difficulty:"easy"},{id:"js-sort-default",question:"What does `[10, 9, 1].sort()` return?",answer:"`[1, 10, 9]` — the default sort compares as strings.",why:"Without a comparator, sort coerces every element to a string and compares by UTF-16 code units. For numbers you must pass one: `sort((a, b) => a - b)`. Note also that sort mutates the array; `toSorted` returns a new one.",difficulty:"easy"},{id:"js-array-holes",question:"Why does `new Array(3).map((_, i) => i)` not produce `[0, 1, 2]`?",answer:"It makes a sparse array of three holes, and `map` skips holes.",why:"The array has length 3 but no elements, and the iteration methods walk actual keys. `Array.from({ length: 3 }, (_, i) => i)` works, and so does `Array(3).fill(0).map(...)` because `fill` writes real values first.",difficulty:"medium"},{id:"js-mutation-methods",question:"Which common array methods mutate in place?",answer:"push, pop, shift, unshift, splice, sort, reverse and fill.",why:"The rest — map, filter, slice, concat — return new arrays. Mixing them up is how React state stops re-rendering: mutating an array in place leaves the reference identical, so nothing downstream can tell it changed.",difficulty:"easy"},{id:"js-object-key-order",question:"What order do object keys iterate in?",answer:"Integer-like keys first in ascending numeric order, then string keys in insertion order.",why:"So `{ b: 1, 2: 2, a: 3 }` iterates 2, b, a. If insertion order genuinely matters — a cache, an ordered lookup — use a Map, which preserves it for every key type and does not stringify keys.",difficulty:"hard"},{id:"js-map-vs-object",question:"When should you reach for a Map instead of a plain object?",answer:"Keys that are not strings, keys that could collide with prototype names, frequent adds and deletes, or when you need the size.",why:'Object keys are coerced to strings, so `obj[1]` and `obj["1"]` are the same slot, and a key called "constructor" or "__proto__" is a hazard. Map keeps key identity, has `.size`, and is optimised for churn.',difficulty:"medium"},{id:"js-json-loses",question:"What does `JSON.parse(JSON.stringify(obj))` silently destroy?",answer:"Dates become strings; undefined, functions and symbols vanish; Map, Set and BigInt break; cycles throw.",why:"It is the traditional deep clone and it is lossy in ways that surface much later — a Date that is now a string usually fails at the first `.getTime()`. `structuredClone` handles all of these except functions.",difficulty:"medium"},{id:"js-float",question:"Why is `0.1 + 0.2 === 0.3` false?",answer:"IEEE-754 binary floating point cannot represent 0.1 or 0.2 exactly.",why:"The sum is 0.30000000000000004. This is not a JavaScript flaw — it is every language with binary floats. Compare with a tolerance, or hold money as integer cents, or use a decimal library. Never store currency in a float.",difficulty:"easy"},{id:"js-label-generators",question:"What does a generator function give you that a normal one does not?",answer:"It can pause at each `yield` and resume where it left off, producing values lazily.",why:"Useful for infinite or expensive sequences you do not want to materialise, for walking a tree without building the whole list, and as the machinery async/await was originally built on top of.",difficulty:"hard"},{id:"js-symbol-iterator",question:"What makes an object work with `for...of` and the spread operator?",answer:"A `[Symbol.iterator]` method returning an iterator.",why:"This is why arrays, strings, Maps and Sets all spread but plain objects do not. Implementing it on your own class is what makes `[...myCollection]` work, and it is what `for...of` looks for — `for...in` is unrelated and walks enumerable string keys, including inherited ones.",difficulty:"hard"},{id:"js-debounce-throttle",question:"What is the difference between debounce and throttle?",answer:"Debounce waits for a pause before firing once; throttle fires at most once per interval during the activity.",why:"Debounce a search box — you want the request after typing stops. Throttle a scroll or resize handler — you want steady updates while it happens, not one at the end.",difficulty:"medium"},{id:"js-error-async",question:"Why does a `try`/`catch` around a call not catch an error thrown inside its `setTimeout` callback?",answer:"The callback runs later, on a different stack — the try block is long gone.",why:"try/catch is lexical and synchronous. The same applies to a promise you do not await: the rejection escapes. Handle errors where the async work actually completes, with `await` inside the try, or `.catch()`, or the callback's own guard.",difficulty:"medium"}]),Dh=qt("practice","Engineering practice","Testing, debugging, review, and judgement.",[{id:"prac-test-pyramid",question:"What does the test pyramid argue?",answer:"Many fast unit tests, fewer integration tests, very few end-to-end tests.",why:"The shape follows from cost: an e2e test is slow, flaky and tells you something broke; a unit test is instant and tells you what. The inverted pyramid — mostly e2e — is a suite nobody runs and nobody trusts.",difficulty:"easy"},{id:"prac-test-behaviour",question:"Why test behaviour rather than implementation?",answer:"A test coupled to implementation fails on every refactor, so it punishes the changes you most want to make.",why:"A suite that breaks when nothing observable changed trains people to update tests without reading them. Assert on what a caller can see — return values, side effects, rendered output — not on which private method was called.",difficulty:"medium"},{id:"prac-coverage",question:"What does 100% test coverage prove?",answer:"That every line executed. Not that any of it was checked.",why:"A test with no assertions gets full coverage. Coverage is useful in the negative — it reliably finds untested code — and misleading as a target, because the cheapest way to raise it is to test what is easy rather than what is risky.",difficulty:"medium"},{id:"prac-flaky-test",question:"What should you do with a flaky test?",answer:"Fix it or delete it. Never retry it into passing.",why:"A test that fails ten percent of the time trains the team to re-run the build, which means the day it catches a real bug nobody believes it. Flakiness is usually a real race in the code, not in the test.",difficulty:"medium"},{id:"prac-tdd-value",question:"What does writing the test first actually buy you?",answer:"A design forced through its own interface, and proof the test can fail.",why:"A test written afterwards has never been seen to fail, so it might assert nothing. Writing it first also makes awkward APIs obvious immediately — if it is hard to test, it is hard to use.",difficulty:"medium"},{id:"prac-bug-first",question:"What is the first step when fixing a reported bug?",answer:"Reproduce it, then write a failing test that captures it.",why:'Without reproduction you are guessing, and a "fix" you cannot verify is a change. The test also stops the bug returning — a regression is a bug someone already paid to find once.',difficulty:"easy"},{id:"prac-bisect-debug",question:"What is the general strategy behind binary search debugging?",answer:"Halve the space the fault can be in, repeatedly — in commits, in code, or in data.",why:"It converts an unbounded hunt into a handful of checks. `git bisect` does it over history; commenting out half a config does it over configuration; truncating an input does it over data.",difficulty:"medium"},{id:"prac-rubber-duck",question:"Why does explaining a bug out loud so often solve it?",answer:"Explanation forces the assumptions to be stated, and one of them is wrong.",why:"Debugging is nearly always finding the belief that is false rather than the line that is wrong. Anything that makes implicit assumptions explicit — writing it down, a colleague, a duck — attacks the actual problem.",difficulty:"easy"},{id:"prac-heisenbug",question:"A bug disappears when you add logging. What does that suggest?",answer:"A race condition or a timing dependency — the logging changed the timing.",why:'Also possible: uninitialised memory, or an optimisation the extra code disabled. The category is "the observation changed the system", and it usually means the code depends on something it should be synchronising on.',difficulty:"hard"},{id:"prac-review-purpose",question:"What is a code review actually for?",answer:"Catching what tests cannot — unclear intent, wrong abstraction, missing cases — and spreading knowledge.",why:"Style belongs to a formatter and correctness largely to tests. If review is mostly comments about spacing, the tooling is missing and the expensive human attention is being spent on the cheapest problem.",difficulty:"easy"},{id:"prac-small-prs",question:"Why do small pull requests get better reviews?",answer:"Review quality falls off a cliff with size — a large diff gets approved rather than read.",why:"Comments per line drop sharply past a few hundred lines. Splitting a refactor from a behaviour change is the highest-value split there is, because then the diff that matters is small and the large one can be scanned.",difficulty:"easy"},{id:"prac-comment-why",question:"What should a comment explain?",answer:"Why, not what. The code already says what.",why:'A comment restating the line is noise that goes stale. A comment recording why the obvious approach was rejected, or which bug a strange line prevents, is the thing that cannot be recovered by reading — and it saves the next person from "fixing" it.',difficulty:"easy"},{id:"prac-naming",question:"Why is naming genuinely hard rather than a joke?",answer:"A name is the interface to a concept — a wrong one makes every reader build the wrong model.",why:"Difficulty naming something is usually the signal that it does not have one responsibility. The fix is often to split it, not to find a cleverer word.",difficulty:"medium"},{id:"prac-premature-abstraction",question:"What is the cost of abstracting too early?",answer:"An abstraction built from one example fits one case, and every later case bends it out of shape.",why:"Duplication is cheaper than the wrong abstraction: duplicated code is easy to see and easy to merge later, whereas a wrong abstraction is threaded through everything. Wait for the third occurrence.",difficulty:"medium"},{id:"prac-yagni",question:"What does YAGNI argue against?",answer:"Building for requirements you have imagined rather than received.",why:"Speculative generality costs complexity now for flexibility that usually turns out to be the wrong flexibility. The counterweight is that some decisions are genuinely expensive to reverse — those deserve thought up front.",difficulty:"easy"},{id:"prac-chesterton",question:"What is Chesterton's Fence, applied to code?",answer:"Do not remove something you do not understand the reason for, until you find the reason.",why:"Odd-looking code is often a bug fix nobody documented. `git log -S` and `git blame` usually find the commit. If the reason has genuinely gone, delete it and say so in the message.",difficulty:"medium"},{id:"prac-idempotency",question:"Why is idempotency the most valuable property in a distributed system?",answer:"Because retries are unavoidable, and only idempotent operations are safe to retry.",why:"Networks lose responses, not just requests — so the caller cannot know whether the work happened. Every reliable system is built out of operations that can be repeated without harm, usually via a deduplication key.",difficulty:"hard"},{id:"prac-at-least-once",question:"Why is exactly-once delivery generally impossible?",answer:"The acknowledgement can be lost, so the sender must choose between resending and not.",why:"What is achievable is at-least-once delivery plus idempotent processing, which is exactly-once *effect*. Systems advertising exactly-once are almost always doing that internally.",difficulty:"hard"},{id:"prac-cap",question:"What does the CAP theorem actually force you to choose between?",answer:"Consistency and availability, but only while a network partition is happening.",why:"It is widely misread as a permanent three-way choice. Partitions are rare and unavoidable; the real question is what your system does during one — refuse writes, or accept them and reconcile later.",difficulty:"hard"},{id:"prac-graceful-degradation",question:"What does it mean to fail gracefully?",answer:"Losing a non-essential dependency reduces functionality instead of taking the whole thing down.",why:"Recommendations time out, so the page renders without them. This requires deciding in advance which dependencies are critical — a decision that is otherwise made accidentally by whichever call has no timeout.",difficulty:"medium"},{id:"prac-feature-flag",question:"What do feature flags buy, and what do they cost?",answer:"Deploy separated from release, and instant rollback. They cost combinatorial complexity and stale branches.",why:"Every live flag doubles the paths through the code, and untested combinations are where the bugs hide. Flags need an owner and a removal date, or they become permanent configuration nobody understands.",difficulty:"medium"},{id:"prac-blameless-postmortem",question:"Why are postmortems blameless?",answer:"Because blame makes people hide information, and the information is the only thing of value.",why:"If an engineer can cause an outage with one command, the finding is that the system allowed it, not that they typed it. Blame produces a culprit; blamelessness produces a guardrail.",difficulty:"medium"},{id:"prac-observability",question:"What is the difference between monitoring and observability?",answer:"Monitoring answers questions you knew to ask; observability lets you ask new ones after the fact.",why:"A dashboard of known metrics cannot explain a failure mode nobody predicted. High-cardinality structured events — request id, user, version — let you slice the data at three in the morning against a question you have only just thought of.",difficulty:"hard"},{id:"prac-log-levels",question:"What distinguishes a WARN from an ERROR in a log?",answer:"ERROR means something failed and someone should look; WARN means something unexpected that the system handled.",why:"The discipline matters because alerting keys off it. Logging every retry as ERROR produces a channel nobody reads, which is functionally the same as having no alerting at all.",difficulty:"easy"},{id:"prac-secrets",question:"A secret was committed and then removed in a later commit. What now?",answer:"Rotate it. It is still in history, and on every clone and fork.",why:"Rewriting history does not recall the copies, and if the repository was ever public assume it was scraped within minutes. Removing it from history is housekeeping; rotation is the fix.",difficulty:"medium"},{id:"prac-least-privilege",question:"What does least privilege mean in practice?",answer:"Every component gets exactly the access it needs, and no more — including your own tooling.",why:"It does not prevent compromise; it bounds it. The difference between a leaked read-only key and a leaked admin key is the difference between an incident and a catastrophe.",difficulty:"medium"}]),Fh=qt("react","React","Renders, effects, keys, and derived state.",[{id:"react-render-is",question:'What does "render" mean in React?',answer:"Calling your component function to produce a description of the UI. It is not a DOM update.",why:'React then compares that description to the last one and touches only the DOM nodes that differ. A re-render with an identical result costs a function call and nothing else — which is why most "unnecessary re-render" panic is misplaced.',difficulty:"easy"},{id:"react-state-snapshot",question:"Why does reading state right after setting it give the old value?",answer:"State is a snapshot for that render. The variable will not change until the next one.",why:"`setCount(count + 1)` twice in a row increments once, because both read the same snapshot. The updater form `setCount(c => c + 1)` reads the pending value and composes correctly.",difficulty:"medium"},{id:"react-derived-state",question:"When should something be state rather than computed during render?",answer:"Only when it cannot be derived from existing props or state.",why:"Storing a filtered list in state means it can disagree with the list it came from, and now needs an effect to keep it in step. Computing it during render makes disagreement impossible. Reach for `useMemo` only if the computation is genuinely expensive.",difficulty:"medium"},{id:"react-effect-purpose",question:"What is `useEffect` actually for?",answer:"Synchronising with something outside React — a subscription, a timer, the document title, a non-React widget.",why:"It is not a lifecycle hook and not the place to transform data for rendering. An effect that only sets state from other state is a render-time computation wearing a costume, and it renders twice to reach the same answer.",difficulty:"medium"},{id:"react-effect-deps",question:"What does an empty dependency array actually claim?",answer:"That the effect uses nothing from the render that can change — so it runs once on mount.",why:"When the effect does close over changing values, the empty array is a lie and it will read stale ones forever. The lint rule is right far more often than the developer overriding it.",difficulty:"medium"},{id:"react-effect-cleanup",question:"What is the cleanup function for, and when does it run?",answer:"Undoing what the effect set up. It runs before the effect re-runs and on unmount.",why:"Without it, subscriptions and intervals accumulate on every dependency change. It is also the fix for the async race: a flag or AbortController in cleanup stops a slow response from overwriting a newer one.",difficulty:"medium"},{id:"react-strict-mode",question:"Why does React 18 in development mount, unmount and remount every component?",answer:"StrictMode deliberately double-invokes to surface effects that are not idempotent or lack cleanup.",why:"A doubled network request or a duplicated subscription in development is the warning that the same bug exists in production the moment the component remounts for any other reason. The fix is cleanup, not disabling StrictMode.",difficulty:"hard"},{id:"react-key-index",question:"Why is the array index a bad `key` for a reorderable list?",answer:"The key identifies which item a piece of state belongs to. Indexes shift, so state follows position rather than data.",why:"Delete the first row and every input's value moves up one. Index keys are fine only for a list that never reorders, filters or removes — which is rarer than it seems.",difficulty:"medium"},{id:"react-key-remount",question:"What happens when you change a component's `key`?",answer:"React discards the old instance and mounts a fresh one, resetting all its state.",why:"That makes `key` a deliberate tool: keying a form on the record id resets it cleanly when the record changes — which is much simpler than an effect that clears every field.",difficulty:"medium"},{id:"react-mutation",question:"Why does pushing to a state array not re-render?",answer:"React compares by reference, and mutating in place leaves the reference identical.",why:"Same for objects. Always produce a new value: `setItems([...items, next])`. This is also why the mutating array methods are the ones to memorise — push, splice and sort are the usual culprits.",difficulty:"easy"},{id:"react-usememo-when",question:"When is `useMemo` actually worth it?",answer:"For genuinely expensive computation, or to keep a stable reference that something downstream depends on.",why:"It is not free — it costs a dependency comparison and memory, and every dependency array is a chance to be wrong. Wrapping a trivial calculation makes the code harder to read and measurably slower.",difficulty:"medium"},{id:"react-memo-breaks",question:"Why does `React.memo` often fail to prevent a re-render?",answer:"A new object, array or inline function prop is a fresh reference every render, so the shallow comparison always fails.",why:"Memoising the child without stabilising the props is the most common wasted optimisation in React. The props need `useCallback`/`useMemo` too — which is a lot of machinery, and usually a sign the render was not the problem.",difficulty:"hard"},{id:"react-usecallback",question:"What does `useCallback` do?",answer:"Returns the same function reference between renders while its dependencies are unchanged.",why:"Only useful when the identity matters — a memoised child, or an effect dependency. Wrapping every handler is cargo cult: a plain function passed to a DOM element costs nothing.",difficulty:"medium"},{id:"react-useref",question:"What are the two distinct uses of `useRef`?",answer:"Holding a DOM node, and holding a mutable value that must not trigger a re-render.",why:'The second is the underused one — a timer id, a previous value, a "has this already run" flag. Changing `.current` never re-renders, which is exactly why it must not hold anything the UI displays.',difficulty:"medium"},{id:"react-context-rerender",question:"What is the performance trap in Context?",answer:"Every consumer re-renders when the value changes, and an inline object literal makes a new value every render.",why:"Memoise the provider value. For a context mixing rarely-changing config with frequently-changing state, split it in two — otherwise one fast-moving field re-renders every consumer of the slow-moving ones.",difficulty:"hard"},{id:"react-context-purpose",question:"What is Context for, and what is it not?",answer:"For avoiding prop drilling of stable, widely-needed values. Not a state manager.",why:"Theme, locale, the current user, a store instance. It has no selectors, so any consumer re-renders on any change — which is why high-frequency state belongs in something with subscriptions instead.",difficulty:"medium"},{id:"react-lifting-state",question:"What is the rule for where state should live?",answer:"In the closest common ancestor of every component that reads it — and no higher.",why:'Too low and siblings cannot share it. Too high and unrelated subtrees re-render and the component becomes a switchboard. Most "we need Redux" moments are actually state that drifted too far up.',difficulty:"easy"},{id:"react-controlled",question:"What makes an input controlled, and what breaks it?",answer:"Its value comes from state with an onChange to update it. Passing a value with no onChange makes it read-only.",why:`Switching between undefined and a value mid-life produces React's "changing an uncontrolled input to be controlled" warning. Initialise to an empty string, not undefined.`,difficulty:"easy"},{id:"react-batching",question:"What changed about state batching in React 18?",answer:"Updates are now batched everywhere, including inside promises, timeouts and native handlers.",why:"Before 18, only React event handlers batched, so two setState calls in a `.then()` caused two renders. Automatic batching removed a whole category of surprise — and occasionally exposed code that relied on the intermediate render.",difficulty:"hard"},{id:"react-suspense",question:"What does `<Suspense>` do?",answer:"Shows a fallback while a child is suspended, and renders the children once ready.",why:"It moves the loading state from inside each component to a boundary around a region, so a group of components can appear together rather than as a cascade of individual spinners.",difficulty:"medium"},{id:"react-error-boundary",question:"What can an error boundary not catch?",answer:"Errors in event handlers, in async code, during server rendering, and in the boundary itself.",why:"It catches errors thrown during rendering, in lifecycle methods and in constructors — the render path. Everything else needs an ordinary try/catch, which surprises people who expect it to be a global net.",difficulty:"hard"},{id:"react-hook-rules",question:"Why must hooks not be called conditionally?",answer:"React identifies them by call order, not by name. A skipped call shifts every subsequent hook onto the wrong state.",why:"There is no registry mapping names to state — just an array walked in order. That single implementation fact explains the whole rule, including why an early return before a hook is equally fatal.",difficulty:"medium"},{id:"react-fetch-effect",question:"What is wrong with fetching data in a bare `useEffect`?",answer:"No caching, no deduplication, races on fast prop changes, a request waterfall, and no retry.",why:"Each of those is fixable by hand and all of them together are a library. That is what React Query, SWR and framework loaders exist for — the effect is not wrong so much as the beginning of a long list.",difficulty:"medium"},{id:"react-list-state-reset",question:"A modal keeps its previous content when opened for a different item. Why?",answer:"It was never unmounted, so its state persisted. React reuses the instance at the same position.",why:"Either key it on the item id to force a remount, or drive it entirely from props. The general rule: state survives as long as the component stays in the same place in the tree with the same key.",difficulty:"hard"},{id:"react-portal",question:"Where do events from a portal bubble to?",answer:"Up the React tree, not the DOM tree.",why:"So a modal rendered into `document.body` still fires the click handler of its React parent. It is usually what you want and occasionally very confusing when a document-level listener also sees the event.",difficulty:"hard"}]),Uh=qt("shell","Shell & regex","Pipes, quoting, exit codes, and the regex that bites.",[{id:"shell-quote",question:"What is the difference between single and double quotes in the shell?",answer:"Single quotes are literal. Double quotes still expand variables, command substitution and backticks.",why:'It is why `echo "$HOME"` prints your path and `echo \'$HOME\'` prints the text. Almost every "it worked in my terminal but not in the script" is a quoting difference.',difficulty:"easy"},{id:"shell-unquoted-var",question:'Why should `$var` almost always be written `"$var"`?',answer:"Unquoted, it undergoes word splitting and glob expansion — so a path with a space becomes two arguments.",why:'It is the single most common shell bug and it only shows up when a filename contains a space or an asterisk. `rm $file` on "my notes.txt" tries to delete two files, neither of which is the one you meant.',difficulty:"medium"},{id:"shell-exit-code",question:"What does an exit code of 0 mean?",answer:"Success. Any non-zero value is a failure, and the specific number is the program's own signal.",why:"Backwards from most truthiness conventions, which is why `if command; then` reads oddly at first. It is also what `&&` and `||` branch on, and what CI uses to decide whether a step passed.",difficulty:"easy"},{id:"shell-pipefail",question:"Why does `set -e` alone not make a script safe?",answer:"A pipeline's exit code is its last command, so a failure earlier in the pipe is invisible.",why:"`curl bad-url | jq .` succeeds because jq succeeded. `set -euo pipefail` is the usual trio: exit on error, error on unset variables, and fail a pipeline if any stage failed.",difficulty:"hard"},{id:"shell-stdout-stderr",question:"What is the difference between `2>&1` and `>&2`?",answer:"The first sends stderr to wherever stdout currently goes; the second sends output to stderr.",why:"Order matters: `cmd > file 2>&1` puts both in the file, but `cmd 2>&1 > file` sends stderr to the terminal, because the duplication happened before stdout was redirected.",difficulty:"hard"},{id:"shell-pipe-buffering",question:"Why does a command's output appear immediately in the terminal but stall when piped?",answer:"Many programs line-buffer to a terminal and block-buffer to a pipe.",why:"The output is sitting in a 4KB buffer, not lost. `stdbuf -oL`, `unbuffer`, or the program's own flag (`grep --line-buffered`, `python -u`) restores line buffering.",difficulty:"hard"},{id:"shell-xargs",question:"What problem do `find -print0` and `xargs -0` solve together?",answer:"Filenames containing spaces or newlines, which ordinary whitespace splitting breaks on.",why:'A null byte is the one character a filename cannot contain, so it is the only safe separator. Without it, "my file.txt" arrives as two arguments — the same class of bug as an unquoted variable.',difficulty:"medium"},{id:"shell-grep-r",question:'What does `grep -rn "foo" .` do that plain `grep` does not?',answer:"Recurses into directories and prints line numbers.",why:"Add `-i` for case-insensitive and `-l` for filenames only. Worth knowing that ripgrep does this faster and respects .gitignore by default, which is usually what you wanted.",difficulty:"easy"},{id:"shell-tail-f",question:"What is the difference between `tail -f` and `tail -F`?",answer:"`-f` follows the file handle; `-F` follows the filename and survives rotation.",why:'When logrotate moves the file, `-f` keeps reading the old inode and appears to go silent forever. `-F` reopens the new file. This is why a log tail "stops working" at midnight.',difficulty:"medium"},{id:"shell-chmod-numbers",question:"What does `chmod 644` mean?",answer:"Owner read+write, group read, others read. Each digit is read 4, write 2, execute 1, summed.",why:"755 is the same plus execute for everyone — the normal setting for a directory or a script. 777 is almost always wrong and is a security finding in any review.",difficulty:"easy"},{id:"shell-path",question:"What does `PATH` control, and why does order matter?",answer:"Where the shell looks for executables. The first match wins.",why:"It is why two versions of a tool can be installed and the wrong one runs. `which -a node` shows every match in order. Putting `.` in PATH is a classic hazard — a file called `ls` in a downloaded folder then runs instead of the real one.",difficulty:"medium"},{id:"shell-source-vs-run",question:"Why does running a script that sets an environment variable not change your shell?",answer:"It runs in a child process, and a child cannot alter its parent's environment.",why:"`source script.sh` (or `. script.sh`) runs it in the current shell instead, which is why activation scripts for virtual environments must be sourced.",difficulty:"medium"},{id:"shell-signals",question:"What is the difference between SIGTERM and SIGKILL?",answer:"TERM asks the process to shut down and can be handled; KILL cannot be caught and stops it immediately.",why:"Reaching for `kill -9` first skips every cleanup handler — flushing buffers, releasing locks, finishing a request. Send TERM, wait, and escalate only if it hangs. This is exactly what a container runtime does on stop.",difficulty:"medium"},{id:"shell-jobs",question:"Why does a background job die when you close the terminal, and how do you prevent it?",answer:"It receives SIGHUP. `nohup`, `disown`, or a terminal multiplexer like tmux prevents it.",why:'The signal means "the terminal hung up". For anything long-running on a remote machine, tmux or screen is the reliable answer, because it also survives your connection dropping mid-command.',difficulty:"medium"},{id:"regex-greedy",question:"Why does `<.*>` match too much in `<a><b>`?",answer:"`*` is greedy — it takes everything, then backtracks to the last `>`.",why:"Use the lazy `<.*?>`, or better the negated class `<[^>]*>`, which cannot overrun in the first place and needs no backtracking. The negated character class is almost always the faster and clearer fix.",difficulty:"medium"},{id:"regex-anchors",question:"What do `^` and `$` mean, and what changes them?",answer:"Start and end of the string. With the multiline flag they mean start and end of a line.",why:"Forgetting to anchor a validation pattern is a security bug: an unanchored pattern matches anywhere, so a check for a safe value passes on a string that merely contains one somewhere.",difficulty:"medium"},{id:"regex-char-class",question:"Inside `[...]`, which characters are still special?",answer:"Very few — mainly `^` at the start, `-` between characters, and `]` and `\\`.",why:"So `[.*+]` matches a literal dot, star or plus with no escaping. Putting `-` first or last makes it literal, which is how `[a-z-]` works.",difficulty:"medium"},{id:"regex-capture-group",question:"What is the difference between `(...)` and `(?:...)`?",answer:"The first captures the match for later use; the second groups without capturing.",why:"Non-capturing groups keep the numbering of the groups you care about stable and avoid the cost of recording matches you will not read. Named groups `(?<year>...)` are better still — position-independent and self-documenting.",difficulty:"medium"},{id:"regex-lookahead",question:"What does a lookahead like `(?=...)` do?",answer:"Asserts what follows without consuming it, so the match position does not advance.",why:'It is how "a password containing a digit and a letter" is expressed as several independent assertions at one position. Negative lookahead `(?!...)` is the same in reverse and is how you say "not followed by".',difficulty:"hard"},{id:"regex-catastrophic",question:"What is catastrophic backtracking?",answer:"Nested quantifiers over overlapping alternatives making the engine try exponentially many paths on a near-match.",why:"A pattern like `(a+)+$` against a long string of a's hangs a thread forever. It is a real denial-of-service vector — ReDoS — whenever a regex meets user input. Avoid nesting quantifiers, and prefer specific character classes.",difficulty:"hard"},{id:"regex-dot",question:"What does `.` not match by default?",answer:"A newline.",why:"Which is why a pattern that works on one line fails on a multi-line block. The dotall flag (`s`) makes it match everything. Note this is a different flag from multiline, which changes the anchors instead — the two are routinely confused.",difficulty:"medium"},{id:"regex-email",question:"Why is validating an email address with a regex a bad idea?",answer:"The grammar is far more permissive than anyone expects, so strict patterns reject valid addresses.",why:"Check for an @ with something on both sides, then send a confirmation message. Deliverability is the only real validation, and it also catches the typo a perfect regex would happily accept.",difficulty:"medium"},{id:"regex-word-boundary",question:"What does `\\b` match?",answer:"A zero-width position between a word character and a non-word character.",why:'It is what makes `\\bcat\\b` match "cat" but not "category". Because "word character" means `[A-Za-z0-9_]`, it behaves surprisingly around accented letters and other scripts.',difficulty:"medium"},{id:"regex-parse-html",question:"Why can a regex not parse HTML?",answer:"HTML nests arbitrarily deeply, and regular expressions cannot count.",why:"Regular languages have no memory of how many tags are open. A regex can scrape a predictable fragment, and will silently produce wrong answers on the first comment, CDATA block or attribute containing a bracket. Use a parser.",difficulty:"medium"},{id:"shell-history-expansion",question:"Why can a `!` inside a double-quoted string break an interactive bash command?",answer:"History expansion runs before quoting is considered, in interactive shells.",why:'`echo "hello!"` can fail with "event not found". Single quotes avoid it, and it does not happen in scripts, where history expansion is off by default — another reason the terminal and the script disagree.',difficulty:"hard"}]),Hh=qt("sql","SQL & databases","Joins, indexes, transactions, isolation.",[{id:"sql-inner-left",question:"What is the difference between an INNER JOIN and a LEFT JOIN?",answer:"Inner keeps only rows matching on both sides; left keeps every left row, filling the right with NULLs.",why:"The usual bug is a LEFT JOIN with a condition on the right table in the WHERE clause — that discards the NULL rows and silently turns it back into an inner join. The condition belongs in the ON clause.",difficulty:"easy"},{id:"sql-where-having",question:"What is the difference between WHERE and HAVING?",answer:"WHERE filters rows before grouping; HAVING filters groups after aggregation.",why:"So you cannot reference an aggregate in WHERE, and filtering in HAVING what could have been filtered in WHERE means aggregating rows you were going to throw away. Filter early.",difficulty:"easy"},{id:"sql-null-comparison",question:"Why does `WHERE column != 'x'` skip rows where the column is NULL?",answer:"Any comparison with NULL yields UNKNOWN, not true, and WHERE keeps only true.",why:"NULL means unknown, so \"is the unknown value not x\" is itself unknown. You need `IS NULL` / `IS NOT NULL`, or `WHERE column IS DISTINCT FROM 'x'`. This is the single most common source of quietly missing rows.",difficulty:"medium"},{id:"sql-count-null",question:"How do `COUNT(*)`, `COUNT(col)` and `COUNT(DISTINCT col)` differ?",answer:"Rows; non-NULL values of col; distinct non-NULL values of col.",why:"The gap between the first two is exactly the number of NULLs, which makes it a quick data-quality check. Aggregates other than COUNT(*) all skip NULLs, so an AVG over a column with missing data averages fewer rows than you think.",difficulty:"medium"},{id:"sql-index-when",question:"When does an index make things worse?",answer:"On write-heavy tables, on low-cardinality columns, and when the query returns a large fraction of the table.",why:"Every index must be updated on insert, update and delete. And a planner will correctly ignore an index if it estimates a scan is cheaper — reading half the table via an index means random I/O for every row.",difficulty:"medium"},{id:"sql-composite-order",question:"Why does the column order in a composite index matter?",answer:"It can only be used for prefixes — an index on (a, b) helps queries on a, and on a+b, but not on b alone.",why:'Think of a phone book sorted by surname then first name: useless for finding every "James". Put the equality-filtered, high-selectivity column first, and the range or sort column after it.',difficulty:"hard"},{id:"sql-sargable",question:"Why does `WHERE YEAR(created_at) = 2026` not use the index on created_at?",answer:"Wrapping the column in a function means the stored values no longer match what is being compared.",why:"The predicate is not sargable. Rewrite as a range — `created_at >= '2026-01-01' AND created_at < '2027-01-01'` — which the index can seek. Alternatively index the expression itself, where the database supports that.",difficulty:"hard"},{id:"sql-covering-index",question:"What is a covering index?",answer:"One containing every column the query needs, so the table itself is never read.",why:"It turns two lookups into one: the index seek is the whole answer. This is why `SELECT *` can be dramatically slower than selecting the three columns you need — the star defeats the covering index.",difficulty:"hard"},{id:"sql-explain",question:"What is the first thing to look for in an EXPLAIN plan?",answer:"A sequential scan on a large table, and a large gap between estimated and actual rows.",why:"The estimate gap is the more useful signal: it means the statistics are stale, and every choice the planner made downstream was based on a bad number. `ANALYZE` refreshes them.",difficulty:"medium"},{id:"sql-acid",question:"What does ACID stand for?",answer:"Atomicity, Consistency, Isolation, Durability.",why:"Atomicity is all-or-nothing; consistency is that constraints hold at commit; isolation is how much concurrent transactions can see of each other; durability is that a commit survives a crash. Isolation is the one with dials on it.",difficulty:"easy"},{id:"sql-isolation-levels",question:"What does READ COMMITTED still allow that REPEATABLE READ does not?",answer:"Non-repeatable reads — the same row read twice in one transaction can differ.",why:"Read committed only guarantees you never see uncommitted data. It is the default in PostgreSQL and SQL Server, which surprises people who assume a transaction gives them a stable snapshot. It does not, unless you ask for one.",difficulty:"hard"},{id:"sql-phantom",question:"What is a phantom read?",answer:"A second identical range query returns rows that were not there before, because another transaction inserted them.",why:"Repeatable read protects rows you already read but not rows that appear. Only SERIALIZABLE prevents it, and it does so by being prepared to abort transactions — so serialisable code must be written to retry.",difficulty:"hard"},{id:"sql-lost-update",question:"Why is read-modify-write in application code unsafe under concurrency?",answer:"Two transactions read the same value, both compute from it, and the second write erases the first.",why:"The lost update. Fix it in one statement — `SET count = count + 1` — or with `SELECT ... FOR UPDATE`, or with an optimistic version column checked in the WHERE clause of the update.",difficulty:"medium"},{id:"sql-deadlock",question:"What causes a database deadlock and what is the standard prevention?",answer:"Two transactions taking the same locks in opposite orders. Prevented by always locking in a consistent order.",why:"The database detects the cycle and kills one transaction, so the application must be ready to retry. Consistent ordering — for instance always by primary key ascending — removes most of them.",difficulty:"hard"},{id:"sql-transaction-scope",question:"Why should a transaction never contain a network call?",answer:"It holds locks for the duration of something that can hang, blocking other writers and exhausting the pool.",why:"A payment API that takes thirty seconds becomes a thirty-second lock. Do the external work outside, and keep the transaction to the writes — this is the ordinary version of the same reasoning behind the saga pattern.",difficulty:"medium"},{id:"sql-injection",question:"Why do parameterised queries stop SQL injection when escaping does not reliably?",answer:"The query and the data travel separately, so data is never parsed as SQL.",why:"Escaping is a string operation that has to be perfect against every encoding and dialect quirk. Parameterisation removes the category — the parser sees the statement before it ever sees the value. It is also usually faster, because plans get reused.",difficulty:"medium"},{id:"sql-normalisation",question:"What is third normal form, informally?",answer:"Every non-key column depends on the key, the whole key, and nothing but the key.",why:"It removes the update anomalies that come from storing the same fact twice. Deliberate denormalisation is then a performance decision made knowingly — with the duplication documented and a plan for keeping the copies in step.",difficulty:"medium"},{id:"sql-fk-value",question:"What does a fo
