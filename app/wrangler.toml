# Bindings for the Pages Functions in app/functions/, read by
# `wrangler pages deploy` in .github/workflows/deploy.yml.
#
# These live here rather than in the Cloudflare dashboard so that what the
# functions can reach is reviewable in a diff. The Worker in ../worker keeps its
# own config: it owns push and the every-minute boss cron, which Pages Functions
# cannot do. Both bind the same D1 database.
#
# Secrets are per-project, not shared with the Worker despite the shared D1
# binding above — Pages and Workers are separate Cloudflare services. The app
# only ever calls this project's `/api/health` (app/functions/api/health.ts),
# never the Worker's own `/health`, so VAPID_PUBLIC_KEY must be set here too —
# the same public key set on the Worker, or a phone can "pair" fine but never
# get a valid push key to subscribe with. See docs/DEPLOY.md's secrets section.
#   npx wrangler pages secret put VAPID_PUBLIC_KEY --project-name heartbeat-app
name = "heartbeat"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-30"

# Transcription runs on Cloudflare's own models, so dictation needs no
# third-party API key — only the account credentials the deploy already uses.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "heartbeat"
database_id = "dcfde6ff-f415-427a-bfc4-c08bd6911699"

# Photographs live here rather than in D1. Workout proof and profile faces were
# base64 inside rows — D1 has a row-size ceiling and is not a blob store, and a
# couple accumulating months of gym photos walks towards it while making every
# unrelated query slower. D1 now keeps a content-addressed key; see
# app/functions/api/media.ts and app/src/domain/media/objectKey.ts.
# Named to match the D1 database rather than something of its own: the account
# already keys everything for this app on "heartbeat", and a binding pointing at
# a bucket that does not exist fails the Pages deploy at publish rather than at
# runtime — which is how this was found.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "heartbeat"

# Preview deploys (any Pages branch that is not production) get their own
# database and bucket, so a PR can be walked on two real phones without
# touching the couple's data. Pages environments do not inherit bindings, so
# every one is repeated. See "Preview deploys" in docs/DEPLOY.md.
[env.preview]

[env.preview.ai]
binding = "AI"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "heartbeat-preview"
database_id = "76201d07-4bff-40de-8b5e-aa0517333c2b"

[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "heartbeat-preview"
